<script>
const DATA_VERSION="0.39";
const DEFAULT={version:DATA_VERSION,configured:true,startingSavings:34000,annualPay:32000,target:75000,years:2,showEssentialsOutcome:true,flexible:0,recurring:[

      {name:"Netflix",amount:20,frequency:"monthly"},
      {name:"Gamepass",amount:20,frequency:"monthly"},
      {name:"YouTube",amount:0.80,frequency:"monthly"},
      {name:"Mobile",amount:17.15,frequency:"monthly"},
      {name:"iRacing",amount:8,frequency:"monthly"},
      {name:"Hair",amount:28,frequency:"monthly"},
      {name:"Cloudigo",amount:3.40,frequency:"monthly"},
      {name:"Gym",amount:180,frequency:"yearly"},
      {name:"Car insurance",amount:400,frequency:"yearly"},
      {name:"Car license",amount:300,frequency:"yearly"}
    ],gifts:[
  {person:"Girlfriend",occasion:"Birthday",amount:200},
  {person:"Girlfriend",occasion:"Christmas",amount:200},
  {person:"Girlfriend",occasion:"Valentines",amount:100},
  {person:"Girlfriend",occasion:"Anniversary",amount:100},
  {person:"Mum",occasion:"Birthday",amount:100},
  {person:"Mum",occasion:"Christmas",amount:100},
  {person:"Dad",occasion:"Birthday",amount:100},
  {person:"Dad",occasion:"Christmas",amount:100},
  {person:"Sister",occasion:"Birthday",amount:50},
  {person:"Sister",occasion:"Christmas",amount:50},
  {person:"Sister's husband",occasion:"Birthday",amount:50},
  {person:"Sister's husband",occasion:"Christmas",amount:50},
  {person:"Child 1",occasion:"Birthday",amount:50},
  {person:"Child 1",occasion:"Christmas",amount:50},
  {person:"Child 2",occasion:"Birthday",amount:50},
  {person:"Child 2",occasion:"Christmas",amount:50}
],weekendFood:173.33,general:100,transactions:[],carry:0,carryHistory:[],stashHistory:[],monthlyActions:{},incomeHistory:[],startDate:"",payDay:1,paychecksPerYear:12,payHistory:[],hiddenBudgetSections:{},skippedPaychecks:{},autoBackup:true,backupIntervalMinutes:15,dark:false,theme:"iconic",openMonths:{},customSections:[],wallets:[],walletFunding:{},allowanceCredits:{},allowanceHistory:[],monthlySnapshots:{}};
function localDateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
let state;
try{
  const saved=JSON.parse(localStorage.getItem("moneywise")||"null");
  if(saved && /^0\.([1-9][0-9]*)$/.test(String(saved.version)) && Number(String(saved.version).split(".")[1])>=11 && Number(String(saved.version).split(".")[1])<=38){
    state={...structuredClone(DEFAULT),...saved,version:DATA_VERSION};
  }else{
    state=structuredClone(DEFAULT);
  }
}catch(e){
  state=structuredClone(DEFAULT);
}
// Allowance used to default to €288. If no explicit allowance was ever configured, reset that legacy default to €0.
if(!state.allowanceConfigured){state.flexible=0;state.allowanceConfigured=false}
if(!state.startDate){state.startDate=localDateKey();state.startDateAuto=true}
Object.keys(DEFAULT).forEach(k=>{if(state[k]===undefined)state[k]=structuredClone(DEFAULT[k])});if(!state.budgetOpen)state.budgetOpen={recurring:false,gifts:false,other:false};if(!state.customSections)state.customSections=[];
if(!state.stashHistory)state.stashHistory=[];if(!state.monthlyActions)state.monthlyActions={};if(!state.incomeHistory)state.incomeHistory=[];if(!state.skippedPaychecks)state.skippedPaychecks={};if(!state.hiddenBudgetSections)state.hiddenBudgetSections={};if(!state.skippedPaychecks)state.skippedPaychecks={};if(!state.payDay)state.payDay=1;if(!state.paychecksPerYear)state.paychecksPerYear=12;if(!state.theme)state.theme=state.dark?"dark":"iconic";
if(!state.budgetDeduct)state.budgetDeduct={};
if(!Array.isArray(state.wallets))state.wallets=[];
if(!state.walletFunding)state.walletFunding={};
if(!state.allowanceCredits)state.allowanceCredits={};
if(!Array.isArray(state.allowanceHistory))state.allowanceHistory=[];
if(!state.monthlySnapshots)state.monthlySnapshots={};
if(!Array.isArray(state.payHistory))state.payHistory=[];
if(!state.payHistory.length){state.payHistory=[{effectiveDate:state.startDate||new Date().toISOString().slice(0,10),annualPay:Number(state.annualPay)||0}]}
state.payHistory=state.payHistory.filter(x=>x&&x.effectiveDate).map(x=>({effectiveDate:String(x.effectiveDate).slice(0,10),annualPay:Math.max(0,Number(x.annualPay)||0)})).sort((a,b)=>a.effectiveDate.localeCompare(b.effectiveDate));
if(state.payHistory.length){const today=localDateKey();let current=Number(state.payHistory[0].annualPay)||0;for(const x of state.payHistory){if(x.effectiveDate<=today)current=Number(x.annualPay)||0;else break}state.annualPay=current;}
if(!state.allowanceHistory.length){state.allowanceHistory=[{effectiveDate:state.startDate||localDateKey(),amount:Number(state.flexible)||0}]}
state.allowanceHistory=state.allowanceHistory.filter(x=>x&&x.effectiveDate).map(x=>({effectiveDate:String(x.effectiveDate).slice(0,10),amount:Math.max(0,Number(x.amount)||0)})).sort((a,b)=>a.effectiveDate.localeCompare(b.effectiveDate));
if(!state.monthlySnapshots)state.monthlySnapshots={};
function ensureMonthSnapshot(k){
  if(!k||state.monthlySnapshots[k])return;
  state.monthlySnapshots[k]={planned:Number(planned())||0,allowance:Number(allowanceForMonth(k))||0,createdAt:new Date().toISOString()};
}

state.wallets.forEach((w,i)=>{if(!w.id)w.id="wallet-"+Date.now()+"-"+i;if(!w.name)w.name="Wallet "+(i+1);if(w.balance===undefined)w.balance=0});
if(state.recurring?.some(x=>x.deductOnPaycheck!==undefined)){state.budgetDeduct.recurring={onPaycheck:!!state.recurring.some(x=>x.deductOnPaycheck)};state.recurring.forEach(x=>delete x.deductOnPaycheck)}
if(state.customSections)state.customSections.forEach((x,i)=>{if(x.deductOnPaycheck!==undefined){state.budgetDeduct["custom-"+i]={onPaycheck:!!x.deductOnPaycheck};delete x.deductOnPaycheck}});
ensureMonthSnapshot(monthKey());
save();

function backupTimestamp(){
  const d=new Date();
  return d.toLocaleString([], {year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}
function backupPayload(){
  return {app:"MoneyWise",version:DATA_VERSION,exportedAt:new Date().toISOString(),state:structuredClone(state)};
}
function saveAutoBackup(){
  try{
    localStorage.setItem("moneywise_auto_backup",JSON.stringify(backupPayload()));
    localStorage.setItem("moneywise_auto_backup_time",new Date().toISOString());
  }catch(e){}
}
function autoBackup(){
  if(state.autoBackup!==false)saveAutoBackup();
}
function downloadBackup(){
  const payload=backupPayload();
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url;a.download=`MoneyWise_Backup_${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackupFile(){
  const input=document.getElementById("backupFile");
  if(input)input.click();
}
function handleBackupImport(input){
  const file=input.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const payload=JSON.parse(reader.result);
      const incoming=payload?.state;

 <div class="card"><div class="row"><b>Pay history</b><button class="secondary" onclick="addPayChange()">＋ Add pay change</button></div><div class="muted">Raises are applied from their effective date onward. Theoretical max uses the full plan income history; projected finish and Essentials-only use the savings actually recorded so far, then project only the remaining income and costs.</div><div style="margin-top:10px">${(state.payHistory||[]).slice().reverse().map((x,ri)=>{const i=state.payHistory.length-1-ri;return `<div class="item"><div class="row"><span>${new Date(x.effectiveDate+"T12:00:00").toLocaleDateString()}</span><b>${euro(x.annualPay)}/yr</b></div>${x.effectiveDate<=localDateKey()&&(!state.payHistory.slice().some(y=>y.effectiveDate>x.effectiveDate&&y.effectiveDate<=localDateKey()))?'<div class="muted small">Current rate</div>':(x.effectiveDate>localDateKey()?'<div class="muted small">Upcoming</div>':'')}<div style="text-align:right"><button class="icon delete trash-btn" onclick="removePayHistory(${i})" aria-label="Delete pay history entry">🗑</button></div></div>`}).join("")}</div></div>
 <div class="card"><b>Monthly allowance</b><div class="muted">Set your flexible spending limit for food, takeaways, outings, entertainment and anything else you want to spend freely.</div><div class="row" style="margin-top:12px"><b>Current limit</b><b>${euro(allowanceForMonth(monthKey()))}</b></div><div class="allowance-calc">${allowanceCalculationText()}</div><button class="secondary" onclick="editAllowance()">✎ Set allowance</button><button onclick="autoAssignAllowance()">⚙ Auto Assign</button><div class="subhead" style="margin-top:16px">Allowance history</div><div class="muted small">Each change keeps its effective date. A future allowance does not affect the current month until its date arrives.</div><div style="margin-top:8px">${(state.allowanceHistory||[]).slice().sort((a,b)=>b.effectiveDate.localeCompare(a.effectiveDate)).map(x=>{const currentEntry=currentAllowanceEntry();const isCurrent=!!currentEntry&&x.effectiveDate===currentEntry.effectiveDate;const upcoming=x.effectiveDate>localDateKey();return `<div class="item"><div class="row"><span>${new Date(x.effectiveDate+"T12:00:00").toLocaleDateString()}</span><b>${euro(x.amount)}/month</b></div><div class="muted small">${upcoming?"Upcoming":(isCurrent?"Current allowance":"Previous allowance")}</div></div>`}).join("")}</div></div>

 <div class="card settings-card"><details><summary><span><b>Settings</b><small class="muted">Colour schemes, backups & data</small></span><span class="settings-chevron">⌄</span></summary><div class="settings-body"><div class="subhead">Colour scheme</div><div class="muted">Choose your MoneyWise look.</div><div class="theme-grid"><div class="theme-choice ${state.theme==="light"?"active":""}" onclick="setTheme('light')"><span class="theme-icon">☀️</span>Light</div><div class="theme-choice ${state.theme==="dark"?"active":""}" onclick="setTheme('dark')"><span class="theme-icon">🌙</span>Dark</div><div class="theme-choice ${state.theme==="iconic"?"active":""}" onclick="setTheme('iconic')"><span class="theme-icon">◈</span>Iconic</div><div class="theme-choice ${state.theme==="flower"?"active":""}" onclick="setTheme('flower')"><span class="theme-icon">🌸</span>Flower</div><div class="theme-choice ${state.theme==="flower-dark"?"active":""}" onclick="setTheme('flower-dark')"><span class="theme-icon">🌙🌸</span>Flower Dark</div><div class="theme-choice ${state.theme==="red-dark"?"active":""}" onclick="setTheme('red-dark')"><span class="theme-icon">🌹</span>Red Dark</div></div><div class="subhead" style="margin-top:16px">Data & backups</div><div class="muted">Automatic local snapshot: ${backupInfo()}</div><button class="secondary" onclick="openBackupSettings()">💾 Backup & restore</button><div class="muted small" style="margin-top:6px">Use Export backup to keep a copy outside Safari, or Import backup to restore one.</div></div></details></div>`;
}
function editAllowance(){
 const today=localDateKey();
 document.getElementById("sheet").innerHTML=`<h2>Monthly allowance</h2><div class="muted">This is your flexible spending budget. Choose when the new limit should take effect so changing a future allowance does not rewrite earlier months.</div>${field("Monthly allowance (€)","ea",allowanceForMonth(monthKey()),".01")}${field("Effective date","ead",today,"","date")}<button onclick="saveAllowance()">Save allowance</button><button class="secondary" onclick="closeModal()">Cancel</button>`;
 document.getElementById("modal").classList.add("open");
}
function saveAllowance(){const amount=Math.max(0,parseFloat(document.getElementById("ea").value)||0),date=document.getElementById("ead")?.value||localDateKey();upsertAllowanceHistory(date,amount);state.allowanceConfigured=true;save();closeModal();render("plan")}
function allowanceCalculationText(){
  const months=monthsInPlan();
  const outcome=essentialsOutcome();
  const target=Number(state.target)||0;
  const available=Math.max(0,outcome-target);
  const monthly=months?available/months:0;
  return `Essentials-only outcome ${euro(outcome)} − target ${euro(target)} = ${euro(available)} available over ${months} months → ${euro(monthly)}/month allowance.`;
}
function autoAssignAllowance(){
 const m=monthsInPlan(),availableForAllowance=Math.max(0,essentialsOutcome()-state.target),monthly=availableForAllowance/m,perPay=monthly*12/(Number(state.paychecksPerYear)||12);
 if(!confirm(`This will alter your allowance so you can JUST meet your target.\n\nEssentials-only outcome: ${euro(essentialsOutcome())}\nTarget: ${euro(state.target)}\nMonths: ${m}\n\nNew monthly allowance: ${euro(monthly)}\nEquivalent per paycheck: ${euro(perPay)} (${state.paychecksPerYear} paychecks/year)\n\nDo you want to apply this allowance?`))return;
 upsertAllowanceHistory(localDateKey(),monthly);state.allowanceConfigured=true;save();render("plan");
}
function showSetup(){
 document.getElementById("sheet").innerHTML=`<h2>Welcome to MoneyWise</h2><p class="muted">Enter your private planning assumptions. They are stored only on this device.</p>${field("Timeframe (years)","sy",2,".5")}${field("Starting savings (€)","ss","",".01")}${field("Annual income (€)","si",""," .01")}${field("Target savings (€)","st",""," .01")}${field("Additional monthly allowance (€)","sf",""," .01")}<button onclick="finishSetup()">Save private plan</button>`;
 document.getElementById("modal").classList.add("open")
}
function finishSetup(){state.years=Math.max(.5,parseFloat(document.getElementById("sy").value)||2);state.startingSavings=Math.max(0,parseFloat(document.getElementById("ss").value)||0);state.annualPay=Math.max(0,parseFloat(document.getElementById("si").value)||0);state.target=Math.max(0,parseFloat(document.getElementById("st").value)||0);upsertAllowanceHistory(localDateKey(),Math.max(0,parseFloat(document.getElementById("sf").value)||0));state.allowanceConfigured=true;state.configured=true;state.startDate=state.startDate||new Date().toISOString().slice(0,10);save();closeModal();render("home")}
function openAdd(type="expense"){
  const income=type==="income", wallets=state.wallets||[];
  const catHtml=income?`<option>Income</option><option>Side hustle</option><option>Other</option>`:`<option>General</option><option>Food</option><option>Entertainment</option><option>Clothes</option><option>Transport</option><option>Gifts</option><option>Holiday</option><option>Other</option>`;
  let destinationHtml="";
  if(income){
    const walletOptions=wallets.map(w=>`<option value="${esc(w.id)}">${esc(w.name)} — ${euro(w.balance)}</option>`).join("");
    destinationHtml=`<label>Where should this money go?</label><select id="incomeDest" onchange="updateIncomeDestination()"><option value="savings">Savings only</option><option value="allowance">Savings + add to allowance</option><option value="wallet">Savings + add to wallet</option></select><div id="walletDestBox" style="display:none"><label>Wallet</label><select id="incomeWallet">${walletOptions}</select>${wallets.length?"":"<div class=\"muted\">Create a wallet in Plan first.</div>"}</div>`;
  }else if(wallets.length){
    const walletOptions=wallets.map(w=>`<option value="${esc(w.id)}">${esc(w.name)} — ${euro(w.balance)}</option>`).join("");
    destinationHtml=`<label>Spending source</label><select id="spendSource" onchange="updateSpendingSource()"><option value="allowance">Monthly allowance</option><option value="wallet">Wallet</option></select><div id="spendWalletBox" style="display:none"><label>Wallet</label><select id="spendWallet">${walletOptions}</select></div>`;
  }
  document.getElementById("sheet").innerHTML=`<h2>${income?"Add income / profit":"Add spending"}</h2><label>Description</label><input id="desc" placeholder="${income?"e.g. Side hustle":"e.g. Dinner"}"><label>Amount (€)</label><input id="amount" type="number" step=".01"><label>Category</label><select id="cat">${catHtml}</select>${destinationHtml}<button onclick="addTx('${income?"income":"expense"}')">Add</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;
  document.getElementById("modal").classList.add("open")
}
function updateIncomeDestination(){const d=document.getElementById("incomeDest")?.value;const box=document.getElementById("walletDestBox");if(box)box.style.display=d==="wallet"?"block":"none"}
function updateSpendingSource(){const d=document.getElementById("spendSource")?.value;const box=document.getElementById("spendWalletBox");if(box)box.style.display=d==="wallet"?"block":"none"}
function addTx(type="expense"){
  let desc=document.getElementById("desc").value.trim()||(type==="income"?"Income":"Spending"),amount=parseFloat(document.getElementById("amount").value);
  if(!amount||amount<=0)return alert("Enter a valid amount.");
  const month=monthKey();
  if(type==="income"){
    const dest=document.getElementById("incomeDest")?.value||"savings",walletId=document.getElementById("incomeWallet")?.value;
    if(dest==="wallet" && !walletById(walletId))return alert("Choose a valid wallet.");
    state.transactions.push({id:Date.now().toString(),month,desc,amount,cat:document.getElementById("cat").value,type:"income",incomeDestination:dest,walletId:dest==="wallet"?walletId:undefined,allowanceCredit:dest==="allowance"});
    if(dest==="allowance"){state.allowanceCredits=state.allowanceCredits||{};state.allowanceCredits[month]=(Number(state.allowanceCredits[month])||0)+amount;}
    if(dest==="wallet")addWalletBalance(walletId,amount);
  }else{
    const source=document.getElementById("spendSource")?.value||"allowance",walletId=document.getElementById("spendWallet")?.value;
    if(source==="wallet"){const w=walletById(walletId);if(!w)return alert("Choose a valid wallet.");if(amount>(Number(w.balance)||0))return alert(`That wallet only has ${euro(w.balance)} available.`);removeWalletBalance(walletId,amount);state.transactions.push({id:Date.now().toString(),month,desc,amount,cat:document.getElementById("cat").value,type:"expense",walletId,fromWallet:true});}
    else state.transactions.push({id:Date.now().toString(),month,desc,amount,cat:document.getElementById("cat").value,type:"expense"});
  }
  save();closeModal();render("cashflow")
}
function delTx(id){
  const tx=state.transactions.find(x=>x.id===id);
  if(!tx)return;
  if(tx.automatic && tx.budgetSection && tx.type==="transfer"){
    if(!confirm("This is an automatic wallet funding entry. Delete it and remove that amount from the wallet?"))return;
    removeWalletBalance(tx.walletId,tx.amount);
  }else if(tx.type==="income" && tx.incomeDestination==="wallet"){
    if(!confirm("This income was added to a wallet. Delete it and remove that amount from the wallet?"))return;
    removeWalletBalance(tx.walletId,tx.amount);
  }else if(tx.type==="income" && tx.allowanceCredit){
    if(!confirm("This income increased this month's allowance. Delete it and remove that allowance credit?"))return;
    state.allowanceCredits=state.allowanceCredits||{};state.allowanceCredits[tx.month]=Math.max(0,(Number(state.allowanceCredits[tx.month])||0)-Number(tx.amount||0));
  }else if(tx.type==="expense" && tx.fromWallet){
    if(!confirm("This spending came from a wallet. Delete it and restore the amount to the wallet?"))return;
    addWalletBalance(tx.walletId,tx.amount);
  }else if(tx.automatic){
    if(!confirm("This is an automatic pay entry. Delete it and stop MoneyWise from adding it again for this payday?"))return;
    state.skippedPaychecks[id]=true;
  }
  state.transactions=state.transactions.filter(x=>x.id!==id);save();render("cashflow")
}
function deleteBudgetSection(key){
  const labels={recurring:"Subscriptions / Recurring",gifts:"Gifts & occasions"};
  const label=labels[key]||((state.customSections||[])[Number(String(key).replace("custom-",""))]?.name||"this section");
  if(confirm(`Remove "${label}" from the Budget? Its data will be kept but excluded from your Essentials calculation.`)){
    state.hiddenBudgetSections=state.hiddenBudgetSections||{};
    state.hiddenBudgetSections[key]=true;
    save();render("budget");
  }
}
function restoreBudgetSections(){
  state.hiddenBudgetSections={};
  save();render("budget");
}
function monthlyActionLogged(kind,month=monthKey()){
  return state.monthlyActions?.[month]?.kind===kind;
}
function confirmMonthlyAction(kind,label){
  const month=monthKey(),existing=state.monthlyActions?.[month];
  if(existing){
    return confirm(`${monthLabel(month)} has already been logged as "${existing.label}". Are you sure you want to do this again? This will add another ${label.toLowerCase()} record.`);
  }
  return true;
}
function logMonthlyAction(kind,label){
  state.monthlyActions=state.monthlyActions||{};
  state.monthlyActions[monthKey()]={kind,label};
}
function carry(){
  let r=Math.max(0,remaining());
  if(!r)return alert("There is no unused allowance to carry.");
  if(!confirmMonthlyAction("carry","Carry unused"))return;
  let from=monthKey(),d=new Date();d.setMonth(d.getMonth()+1);let to=monthKey(d);
  state.carryHistory.push({from,to,amount:r});state.carry=r;logMonthlyAction("carry","Carry unused");save();render("home")
}
function editCarry(i){let x=state.carryHistory[i];document.getElementById("sheet").innerHTML=`<h2>Edit carried allowance</h2><div class="muted">${monthLabel(x.from)} → ${monthLabel(x.to)}</div><label>Amount (€)</label><input id="ca" type="number" step=".01" value="${x.amount}"><button onclick="saveCarry(${i})">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;document.getElementById("modal").classList.add("open")}
function saveCarry(i){let a=parseFloat(document.getElementById("ca").value);if(isNaN(a)||a<0)return alert("Enter a valid amount.");state.carryHistory[i].amount=a;state.carry=a;save();closeModal();render("home")}
function deleteCarry(i){if(confirm("Delete this carried allowance?")){state.carryHistory.splice(i,1);state.carry=state.carryHistory.length?state.carryHistory[state.carryHistory.length-1].amount:0;save();render("home")}}
function stashUnused(){
  let r=Math.max(0,remaining());
  if(!r)return alert("There is no unused allowance to stash.");
  if(!confirmMonthlyAction("stash","Stash / save"))return;
  let month=monthKey();
  state.stashHistory.push({month,amount:r});
  state.carry=0;
  logMonthlyAction("stash","Stash / save");save();render("home");
}
function carryPortionAndStash(){
  let r=Math.max(0,remaining());
  if(!r)return alert("There is no unused allowance to split.");
  if(!confirmMonthlyAction("split","Carry portion + stash rest"))return;
  document.getElementById("sheet").innerHTML=`<h2>Carry portion + stash rest</h2><div class="muted">Unused allowance: ${euro(r)}. Enter how much you want to carry into next month. The rest will be stashed into the projected pool.</div>${field("Amount to carry (€)","cpa",r,".01")}<button onclick="saveCarryPortion()">Save split</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;
  document.getElementById("modal").classList.add("open");
}
function saveCarryPortion(){
  let total=Math.max(0,remaining()),carryAmount=parseFloat(document.getElementById("cpa").value);
  if(isNaN(carryAmount)||carryAmount<0||carryAmount>total)return alert("Enter a carry amount between €0 and the unused allowance.");
  let stashAmount=total-carryAmount,from=monthKey(),d=new Date();d.setMonth(d.getMonth()+1);let to=monthKey(d);
  if(carryAmount>0){
    state.carryHistory.push({from,to,amount:carryAmount});
    state.carry=carryAmount;
  }else state.carry=0;
  if(stashAmount>0)state.stashHistory.push({month:from,amount:stashAmount});
  logMonthlyAction("split","Carry portion + stash rest");
  save();closeModal();render("home");
}
function editStash(i){
  let x=state.stashHistory[i];
  document.getElementById("sheet").innerHTML=`<h2>Edit stashed amount</h2><div class="muted">${monthLabel(x.month)} → added to projected pool</div>${field("Amount (€)","sa",x.amount,".01")}<button onclick="saveStash(${i})">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;
  document.getElementById("modal").classList.add("open");
}
function saveStash(i){
  let a=parseFloat(document.getElementById("sa").value);
  if(isNaN(a)||a<0)return alert("Enter a valid amount.");
  state.stashHistory[i].amount=a;save();closeModal();render("home");
}
function deleteStash(i){
  if(confirm("Delete this stashed amount?")){
    state.stashHistory.splice(i,1);save();render("home");
  }
}
function toggleMonth(k){state.openMonths[k]=!state.openMonths[k];save();render("cashflow")}
function editPlanned(){document.getElementById("sheet").innerHTML=`<h2>Additional allowance</h2><div class="muted">This is money available for spending from the Spend section.</div>${field("Monthly allowance (€)","fa",state.flexible,".01")}<button onclick="saveFlex()">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;document.getElementById("modal").classList.add("open")}
function saveFlex(){const amount=Math.max(0,parseFloat(document.getElementById("fa").value)||0);upsertAllowanceHistory(localDateKey(),amount);state.allowanceConfigured=true;save();closeModal();render("cashflow")}
function addWallet(){
 document.getElementById("sheet").innerHTML=`<h2>Add wallet</h2>${field("Wallet name","wn","","","text")}<button onclick="saveNewWallet()">Create wallet</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;document.getElementById("modal").classList.add("open");
}
function saveNewWallet(){const name=document.getElementById("wn").value.trim();if(!name)return alert("Enter a wallet name.");state.wallets.push({id:"wallet-"+Date.now(),name,balance:0});save();closeModal();render("plan")}
function editWallet(id){const w=walletById(id);if(!w)return;document.getElementById("sheet").innerHTML=`<h2>Edit wallet</h2>${field("Wallet name","wn",w.name,"","text")}${field("Balance (€)","wb",w.balance,".01")}<div class="muted">Changing the balance here is a manual correction; it does not create a cash-flow entry.</div><button onclick="saveWallet('${esc(id)}')">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;document.getElementById("modal").classList.add("open")}
function saveWallet(id){const w=walletById(id);if(!w)return;const n=document.getElementById("wn").value.trim();const b=Math.max(0,parseFloat(document.getElementById("wb").value)||0);if(!n)return alert("Enter a wallet name.");w.name=n;w.balance=b;save();closeModal();render("plan")}
function deleteWallet(id){const w=walletById(id);if(!w)return;if((Number(w.balance)||0)>0)return alert("Empty the wallet before deleting it.");if(confirm(`Delete wallet \"${w.name}\"?`)){state.wallets=state.wallets.filter(x=>x.id!==id);Object.keys(state.walletFunding||{}).forEach(k=>{if(state.walletFunding[k]?.walletId===id)state.walletFunding[k]={enabled:false,walletId:""}});save();render("plan")}}
function toggleBudgetWallet(key){
 state.walletFunding=state.walletFunding||{};const current=state.walletFunding[key]||{};
 if(!(state.wallets||[]).length)return alert("Create a wallet in Plan first.");
 const next=!current.enabled;
 if(next && !walletById(current.walletId))current.walletId=state.wallets[0].id;
 state.walletFunding[key]={...current,enabled:next};
 if(next){state.budgetDeduct[key]={...(state.budgetDeduct[key]||{}),onPaycheck:false};}
 save();render("budget");
}
function setBudgetWallet(key,walletId){state.walletFunding=state.walletFunding||{};state.walletFunding[key]={...(state.walletFunding[key]||{}),walletId};if(walletId)state.walletFunding[key].enabled=true;save();render("budget")}
function addRecurring(){editRecurring(-1)}
function editRecurring(i){
  let x=i>=0?state.recurring[i]:{name:"",amount:0,frequency:"monthly"};
  document.getElementById("sheet").innerHTML=`<h2>${i>=0?"Edit":"Add"} recurring expense</h2>
  ${field("Name","rn",x.name,"","text")}
  ${field("Amount (€)","ra",x.amount,".01")}
  <label>Frequency</label><select id="rf"><option value="monthly" ${x.frequency==="monthly"?"selected":""}>Monthly</option><option value="yearly" ${x.frequency==="yearly"?"selected":""}>Yearly</option></select>
  <button onclick="saveRecurring(${i})">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;
  document.getElementById("modal").classList.add("open")
}
function saveRecurring(i){
  let n=document.getElementById("rn").value.trim(),a=parseFloat(document.getElementById("ra").value)||0,f=document.getElementById("rf").value;
  if(!n)return;
  let item={name:n,amount:a,frequency:f};
  if(i>=0)state.recurring[i]=item;else state.recurring.push(item);
  save();closeModal();render("budget")
}
function deleteRecurring(i){if(confirm("Delete this recurring expense?")){state.recurring.splice(i,1);save();render("budget")}}

function toggleBudgetSection(key){
  if(!state.budgetOpen)state.budgetOpen={};
  state.budgetOpen[key]=!state.budgetOpen[key];
  save();render("budget");
}
function toggleBudgetDeduct(key){
  state.budgetDeduct=state.budgetDeduct||{};
  const next=!state.budgetDeduct[key]?.onPaycheck;
  state.budgetDeduct[key]={...(state.budgetDeduct[key]||{}),onPaycheck:next};
  if(next && state.walletFunding?.[key])state.walletFunding[key].enabled=false;
  save();render("budget");
}
function forceBudgetDeduct(key){
  const info=budgetSectionInfo(key);
  if(!info)return;
  if(walletFundingEnabled(key)){
    const month=monthKey(),id=walletTransactionId("wallet-fund",key,month);
    if(state.transactions.some(x=>x.id===id))return alert(`${info.title} has already funded ${walletLabel(state.walletFunding[key].walletId)} for ${monthLabel(month)}.`);
    if(!confirm(`Fund ${walletLabel(state.walletFunding[key].walletId)} with ${euro(info.amount)} for ${monthLabel(month)}?`))return;
    if(fundBudgetWallet(key,month,true)){save();render("budget");}
    return;
  }
  const month=monthKey(),id=budgetDeductionId(key,month);
  if(state.transactions.some(x=>x.id===id))return alert(`${info.title} has already been deducted for ${monthLabel(month)}.`);
  if(!confirm(`Force deduct ${euro(info.amount)} for ${info.title} from savings for ${monthLabel(month)}?`))return;
  if(deductBudgetSection(key,month,true)){save();render("budget");}
}

function addCustomSection(){
  state.customSections=state.customSections||[];
  state.customSections.push({name:"New section",items:[]});
  const i=state.customSections.length-1;
  save();editCustomSection(i);
}
function editCustomSection(i){
  const s=state.customSections[i];

  document.getElementById("modal").classList.add("open");
}
function saveCustomSection(i){

  if(!n)return;
  state.customSections[i].name=n;save();closeModal();render("budget");
}
function deleteCustomSection(i){

    state.customSections.splice(i,1);save();render("budget");
  }
}
function addCustomItem(i){editCustomItem(i,-1)}
function editCustomItem(i,j){

  document.getElementById("sheet").innerHTML=`<h2>${j>=0?"Edit":"Add"} item</h2>${field("Name","cin",x.name,"","text")}${field("Amount (€)","cia",x.amount,".01")}<label>Frequency</label><select id="cif"><option value="monthly" ${x.frequency!=="yearly"?"selected":""}>Monthly</option><option value="yearly" ${x.frequency==="yearly"?"selected":""}>Yearly</option></select><button onclick="saveCustomItem(${i},${j})">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;
  document.getElementById("modal").classList.add("open");
}
function saveCustomItem(i,j){

  if(!n)return;
  const item={name:n,amount:a,frequency};
  if(j>=0)state.customSections[i].items[j]=item;else state.customSections[i].items.push(item);
  save();closeModal();render("budget");
}
function deleteCustomItem(i,j){
  if(confirm("Delete this item?")){state.customSections[i].items.splice(j,1);save();render("budget")}
}
function editGift(i){
  const g=state.gifts[i];
  document.getElementById("sheet").innerHTML=`<h2>Edit gift</h2>${field("Person","sgp",g.person,"","text")}${field("Occasion","sgo",g.occasion,"","text")}${field("Amount (€)","sgm",g.amount,".01")}<button onclick="saveGift(${i})">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;
  document.getElementById("modal").classList.add("open");
}
function saveGift(i){
  state.gifts[i].person=document.getElementById("sgp").value.trim()||"Gift";
  state.gifts[i].occasion=document.getElementById("sgo").value.trim()||"Occasion";
  state.gifts[i].amount=Math.max(0,parseFloat(document.getElementById("sgm").value)||0);
  save();closeModal();render("budget");
}
function removeGiftDirect(i){
  if(confirm("Delete this gift occasion?")){
    state.gifts.splice(i,1);save();render("budget");
  }
}
function addGiftDirect(){
  state.gifts.push({person:"",occasion:"",amount:0});
  editGifts();
}
function editGifts(){
  const rows=Array.isArray(state.gifts)?state.gifts:[];
  document.getElementById("sheet").innerHTML=`<h2>Gifts & occasions</h2>
    <div class="muted">€${giftMonthly().toFixed(2)}/month average • ${rows.length} occasions</div>
    <div id="giftEditorList" style="margin-top:14px">
      ${rows.map((g,i)=>giftEditorRow(g,i)).join("")}
    </div>
    <button class="secondary" onclick="addGift()">＋ Add gift</button>
    <button onclick="saveGifts()">Save changes</button>
    <button class="secondary" onclick="closeModal()">Cancel</button>`;
  document.getElementById("modal").classList.add("open")
}
function giftEditorRow(g,i){
  return `<div class="item gift-editor-row" id="gift-row-${i}">
    <div class="grid2">
      <div><label>Person</label><input id="gp-${i}" type="text" value="${esc(g.person)}"></div>
      <div><label>Occasion</label><input id="go-${i}" type="text" value="${esc(g.occasion)}"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <label style="margin:0">Amount (€)</label>
      <span style="display:flex;gap:8px;align-items:center"><input id="gm-${i}" type="number" min="0" step=".01" value="${Number(g.amount)||0}" style="max-width:120px"><button class="icon delete trash-btn" onclick="removeGift(${i})" aria-label="Delete gift" class="trash-btn" aria-label="Delete">🗑<//button></span>
    </div>
  </div>`
}
function addGift(){
  state.gifts.push({person:"",occasion:"",amount:0});
  editGifts();
}
function removeGift(i){
  if(confirm("Delete this gift occasion?")){
    state.gifts.splice(i,1);
    editGifts();
  }
}
function saveGifts(){
  const rows=Array.isArray(state.gifts)?state.gifts:[];
  rows.forEach((g,i)=>{
    g.person=document.getElementById("gp-"+i)?.value.trim()||"Gift";
    g.occasion=document.getElementById("go-"+i)?.value.trim()||"Occasion";
    g.amount=Math.max(0,parseFloat(document.getElementById("gm-"+i)?.value)||0);
  });
  state.gifts=rows;
  save();closeModal();render("budget")
}
function targetChangedAllowancePrompt(oldTarget,newTarget){
 if(Number(oldTarget)===Number(newTarget))return;
 const months=monthsInPlan(),outcome=essentialsOutcome(),suggested=Math.max(0,(outcome-Number(newTarget))/months),perPay=suggested*12/(Number(state.paychecksPerYear)||12);
 if(confirm(`Hey — you changed your target to ${euro(newTarget)}.\n\nAuto Assign can adjust your allowance to ${euro(suggested)}/month so the new target is met.\n\nEquivalent per paycheck: ${euro(perPay)}\n\nChange allowance to ${euro(suggested)}?\n\nOK = Auto Assign new allowance\nCancel = keep current allowance`)){
   upsertAllowanceHistory(localDateKey(),suggested);
   state.allowanceConfigured=true;
 }
}
function addPayChange(){
 const today=new Date().toISOString().slice(0,10);
 document.getElementById("sheet").innerHTML=`<h2>Add pay change</h2><div class="muted">Record a raise or other salary change without losing the previous rate.</div>${field("New annual income (€)","npc",state.annualPay,".01")}${field("Effective date","npd",today,"","date")}<button onclick="savePayChange()">Save pay change</button><button class="secondary" onclick="closeModal()">Cancel</button>`;
 document.getElementById("modal").classList.add("open");
}
function savePayChange(){const amount=Math.max(0,Number(document.getElementById("npc").value)||0),date=document.getElementById("npd").value||new Date().toISOString().slice(0,10);upsertPayHistory(date,amount);save();closeModal();render("plan")}
function settings(){
 document.getElementById("sheet").innerHTML=`<h2>Edit plan assumptions</h2><p class="muted">These values are stored locally on this device.</p>${field("Timeframe (years)","py",state.years,".5")}${field("Starting savings (€)","ps",state.startingSavings,".01")}${field("Project start date","pdate",state.startDate,"","date")}${field("Annual income (€)","pi",state.annualPay,".01")}${field("Pay effective date","ppdate",new Date().toISOString().slice(0,10),"","date")}<div class="muted small">If you change annual income, this date records when the new salary takes effect.</div>${field("Target savings (€)","pt",state.target,".01")}${field("Paychecks per year","pp",state.paychecksPerYear,"1")}${field("Pay day (day of month)","pd",state.payDay,"1")}${field("Monthly allowance (€)","pf",allowanceForMonth(monthKey()),".01")}${field("Allowance effective date","pfdate",localDateKey(),"","date")}<button onclick="saveSettings()">Save</button> <button class="secondary" onclick="closeModal()">Cancel</button>`;
 document.getElementById("modal").classList.add("open")
}
function saveSettings(){
 const oldTarget=Number(state.target)||0;
 state.years=Number(document.getElementById("py").value)||1;
 state.startingSavings=Number(document.getElementById("ps").value)||0;
 state.startDate=document.getElementById("pdate").value||localDateKey();
 const newAnnualPay=Math.max(0,Number(document.getElementById("pi").value)||0);
 const payEffectiveDate=document.getElementById("ppdate")?.value||new Date().toISOString().slice(0,10);
 if(newAnnualPay!==Number(state.annualPay)||!state.payHistory.length)upsertPayHistory(payEffectiveDate,newAnnualPay);
 else state.annualPay=newAnnualPay;
 state.target=Number(document.getElementById("pt").value)||0;
 state.paychecksPerYear=Math.max(1,Number(document.getElementById("pp").value)||12);
 state.payDay=Math.min(31,Math.max(1,Number(document.getElementById("pd").value)||1));
 upsertAllowanceHistory(document.getElementById("pfdate")?.value||localDateKey(),Math.max(0,Number(document.getElementById("pf").value)||0));state.allowanceConfigured=true;
 targetChangedAllowancePrompt(oldTarget,state.target);
 save();
 closeModal();
 render("plan");
}
function field(label,id,val,step=".01",type="number"){return `<label>${label}</label><input id="${id}" type="${type}" ${type==="number"?"min=\"0\" step=\""+step+"\"":""} value="${val===undefined?"":esc(val)}">`}
function setTheme(t){state.theme=t;state.dark=t==="dark";save();render("plan")}
function toggleEssentials(){state.showEssentialsOutcome=!state.showEssentialsOutcome;save();render("plan")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.tab)));
render("home");
startAutoBackupTimer();
if(state?.autoBackup!==false)saveAutoBackup();
/* Baseline loads directly; setup remains optional through editing. */

let autoBackupTimer=null;
function startAutoBackupTimer(){
  if(autoBackupTimer)clearInterval(autoBackupTimer);
  autoBackupTimer=setInterval(()=>{
    if(state?.autoBackup!==false)saveAutoBackup();
  },(Number(state?.backupIntervalMinutes)||15)*60*1000);
}
window.addEventListener("beforeunload",()=>{if(state?.autoBackup!==false)saveAutoBackup()});
</script>
